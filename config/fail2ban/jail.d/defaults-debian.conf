# ═══════════════════════════════════════════════════════════
# Secure Research Portal — Fail2ban defaults (Debian/Ubuntu)
# This file is shipped by the Debian fail2ban package. Kept here
# for reference and reproduction.
# Install: /etc/fail2ban/jail.d/defaults-debian.conf
# ═══════════════════════════════════════════════════════════

[DEFAULT]
banaction = nftables
banaction_allports = nftables[type=allports]
backend = systemd

[sshd]
enabled = true
