# ═══════════════════════════════════════════════════════════
# Secure Research Portal — Password quality policy
# Target: libpam-pwquality on Ubuntu Server 24.04 LTS
# Install: /etc/security/pwquality.conf  (PAM picks it up automatically)
# Also requires the package:  sudo apt install libpam-pwquality
#
# Behaviour: weak passwords are REJECTED (not warned), even for root.
# ═══════════════════════════════════════════════════════════

# Minimum length — defeats short brute-forceable passwords
minlen = 12

# Negative credit forces at least one of each required character class
dcredit  = -1    # at least 1 digit
ucredit  = -1    # at least 1 uppercase letter
lcredit  = -1    # at least 1 lowercase letter
ocredit  = -1    # at least 1 special character

# Limit identical consecutive characters
maxrepeat = 3

# Hard enforcement — passwords failing the policy cannot be set at all
enforcing = 1
enforce_for_root
