# ═══════════════════════════════════════════════════════════
# Secure Research Portal — Main Nginx configuration
# Target: Nginx 1.24+ on Ubuntu Server 24.04 LTS
# Install: /etc/nginx/nginx.conf  →  nginx -t && systemctl reload nginx
# ═══════════════════════════════════════════════════════════

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    # --- Hide Nginx version from responses (anti-fingerprinting) ---
    server_tokens off;

    # --- Security headers (applied to every response globally) ---
    add_header X-Frame-Options           "SAMEORIGIN" always;     # Clickjacking
    add_header X-Content-Type-Options    "nosniff" always;        # MIME sniffing
    add_header Content-Security-Policy   "default-src 'self'" always;  # Content injection
    add_header Referrer-Policy           "no-referrer" always;    # Referrer leakage
    add_header X-XSS-Protection          "1; mode=block" always;  # Legacy XSS filter
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;  # HSTS

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- TLS hardening: TLS 1.3 only ---
    # Removes TLS 1.0/1.1 (BEAST, POODLE) and the need to curate TLS 1.2 cipher lists.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
